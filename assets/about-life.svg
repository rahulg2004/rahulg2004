<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    
<defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#247bff" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#ff354f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#247bff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.15"/>
    </pattern>
</defs>

    
<style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; }
    .subtitle { font-weight: 600; fill: #247bff; }
    .text { font-weight: 400; fill: #f0f0f0; }
    .text-dim { font-weight: 400; fill: #8b949e; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
</style>

    <style>
        .slide { opacity: 0; animation: fadeSlide 12s infinite; }
        .s1 { animation-delay: 0s; }
        .s2 { animation-delay: 4s; }
        .s3 { animation-delay: 8s; }
        @keyframes fadeSlide {
            0%, 4% { opacity: 0; transform: translateX(10px); }
            8%, 30% { opacity: 1; transform: translateX(0); }
            33%, 100% { opacity: 0; transform: translateX(-10px); }
        }
        .bar-fill {
            fill: #247bff;
            animation: progress 12s infinite linear;
        }
        .b1 { animation-delay: 0s; }
        .b2 { animation-delay: 4s; }
        .b3 { animation-delay: 8s; }
        @keyframes progress {
            0% { width: 0; }
            33.33% { width: 100%; }
            100% { width: 100%; }
        }
        .card {
            transition: transform 0.3s ease;
        }
    </style>

    <rect width="800" height="400" rx="15" fill="#070b16"/>
    <rect width="800" height="400" rx="15" fill="url(#dots)"/>
    
    <!-- Left Panel: Identity -->
    <g transform="translate(40, 40)">
        <text class="subtitle mono" font-size="14" y="0">01 / IDENTITY</text>
        
        <rect x="0" y="30" width="340" height="300" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.1)"/>
        
        <g transform="translate(25, 70)">
            <text class="title" font-size="20" y="0">Rahul Gupta</text>
            <text class="text-dim" font-size="14" y="25">3rd Year B.Sc. Computer Science</text>
            <text class="text-dim" font-size="14" y="45">University of Delhi (KMV)</text>
            <text class="text-dim" font-size="14" y="65">New Delhi, India</text>
            
            <line x1="0" y1="95" x2="290" y2="95" stroke="rgba(255,255,255,0.1)"/>
            
            <text class="subtitle mono" font-size="12" y="125">FOCUS AREAS</text>
            <g transform="translate(0, 145)">
                <rect x="0" y="0" width="135" height="26" rx="13" fill="rgba(36, 123, 255, 0.1)" stroke="#247bff" stroke-opacity="0.3"/>
                <text class="text" font-size="12" x="15" y="17">Generative AI</text>
                
                <rect x="145" y="0" width="135" height="26" rx="13" fill="rgba(36, 123, 255, 0.1)" stroke="#247bff" stroke-opacity="0.3"/>
                <text class="text" font-size="12" x="160" y="17">Machine Learning</text>
                
                <rect x="0" y="35" width="135" height="26" rx="13" fill="rgba(36, 123, 255, 0.1)" stroke="#247bff" stroke-opacity="0.3"/>
                <text class="text" font-size="12" x="15" y="52">Software Eng</text>

                <rect x="145" y="35" width="135" height="26" rx="13" fill="rgba(36, 123, 255, 0.1)" stroke="#247bff" stroke-opacity="0.3"/>
                <text class="text" font-size="12" x="160" y="52">Python &amp; C++</text>
            </g>
        </g>
    </g>

    <!-- Right Panel: Carousel -->
    <g transform="translate(420, 40)">
        <text class="subtitle mono" font-size="14" y="0">02 / DOMAINS</text>
        
        <rect x="0" y="30" width="340" height="300" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.1)"/>
        
        <!-- Progress bars -->
        <g transform="translate(25, 50)">
            <rect x="0" y="0" width="90" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
            <rect x="100" y="0" width="90" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
            <rect x="200" y="0" width="90" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
            
            <rect x="0" y="0" width="0" height="4" rx="2" class="bar-fill b1"/>
            <rect x="100" y="0" width="0" height="4" rx="2" class="bar-fill b2"/>
            <rect x="200" y="0" width="0" height="4" rx="2" class="bar-fill b3"/>
        </g>
        
        <g transform="translate(25, 90)">
            <!-- Slide 1 -->
            <g class="slide s1">
                <text class="title" font-size="22" y="0" fill="#247bff">AI &amp; Intelligent Systems</text>
                <text class="text text-dim" font-size="14" y="30">Exploring modern neural architectures,</text>
                <text class="text text-dim" font-size="14" y="50">LLMs, and computer vision pipelines.</text>
                <circle cx="20" cy="110" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="114">Google Gemini &amp; OpenAI Integrations</text>
                <circle cx="20" cy="140" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="144">RAG Systems &amp; Autonomous Agents</text>
                <circle cx="20" cy="170" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="174">Natural Language Processing</text>
            </g>

            <!-- Slide 2 -->
            <g class="slide s2">
                <text class="title" font-size="22" y="0" fill="#247bff">Software Development</text>
                <text class="text text-dim" font-size="14" y="30">Building scalable backend services</text>
                <text class="text text-dim" font-size="14" y="50">and performant core logic.</text>
                <circle cx="20" cy="110" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="114">Python &amp; C++ Application Logic</text>
                <circle cx="20" cy="140" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="144">Web Architecture (FastAPI, Flask)</text>
                <circle cx="20" cy="170" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="174">Frontend Integration (React, JS)</text>
            </g>

            <!-- Slide 3 -->
            <g class="slide s3">
                <text class="title" font-size="22" y="0" fill="#247bff">Creative Digital Work</text>
                <text class="text text-dim" font-size="14" y="30">Combining technical skills with</text>
                <text class="text text-dim" font-size="14" y="50">visual design and storytelling.</text>
                <circle cx="20" cy="110" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="114">UI / UX Prototyping (Figma)</text>
                <circle cx="20" cy="140" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="144">Video Engineering (Premiere/AE)</text>
                <circle cx="20" cy="170" r="4" fill="#ff354f"/>
                <text class="text" font-size="13" x="35" y="174">Multimodal Generative Art</text>
            </g>
        </g>
    </g>
</svg>