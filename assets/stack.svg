<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    
<defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#247bff" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#ff354f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#247bff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.15"/>
    </pattern>
</defs>

    
<style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; }
    .subtitle { font-weight: 600; fill: #247bff; }
    .text { font-weight: 400; fill: #f0f0f0; }
    .text-dim { font-weight: 400; fill: #8b949e; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
</style>

    <style>
        .stack-card { fill: #0d1117; stroke: rgba(36,123,255,0.2); transition: all 0.3s; }
        .chip { fill: rgba(36, 123, 255, 0.1); stroke: #247bff; stroke-opacity: 0.3; }
        .float { animation: floating 6s ease-in-out infinite; }
        .float-d1 { animation-delay: 1s; }
        .float-d2 { animation-delay: 2s; }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>

    <rect width="800" height="400" rx="15" fill="#070b16"/>
    <rect width="800" height="400" rx="15" fill="url(#dots)"/>
    
    <text class="title mono" font-size="16" x="40" y="40" fill="#247bff">TECH ARSENAL</text>

    <!-- AI & ML -->
    <g transform="translate(40, 70)" class="float">
        <rect class="stack-card" x="0" y="0" width="220" height="150" rx="10"/>
        <text class="subtitle" font-size="14" x="20" y="30">AI &amp; Machine Learning</text>
        <line x1="20" y1="45" x2="200" y2="45" stroke="rgba(255,255,255,0.1)"/>
        <g transform="translate(20, 60)">
            <rect class="chip" x="0" y="0" width="60" height="22" rx="4"/><text class="text" font-size="11" x="30" y="15" text-anchor="middle">Python</text>
            <rect class="chip" x="68" y="0" width="65" height="22" rx="4"/><text class="text" font-size="11" x="100" y="15" text-anchor="middle">PyTorch</text>
            <rect class="chip" x="141" y="0" width="39" height="22" rx="4"/><text class="text" font-size="11" x="160" y="15" text-anchor="middle">OpenCV</text>
            
            <rect class="chip" x="0" y="30" width="55" height="22" rx="4"/><text class="text" font-size="11" x="27" y="45" text-anchor="middle">Gemini</text>
            <rect class="chip" x="63" y="30" width="55" height="22" rx="4"/><text class="text" font-size="11" x="90" y="45" text-anchor="middle">OpenAI</text>
            <rect class="chip" x="126" y="30" width="40" height="22" rx="4"/><text class="text" font-size="11" x="146" y="45" text-anchor="middle">LLMs</text>
            
            <rect class="chip" x="0" y="60" width="50" height="22" rx="4"/><text class="text" font-size="11" x="25" y="75" text-anchor="middle">NLTK</text>
            <rect class="chip" x="58" y="60" width="45" height="22" rx="4"/><text class="text" font-size="11" x="80" y="75" text-anchor="middle">NLP</text>
        </g>
    </g>

    <!-- Software & Programming -->
    <g transform="translate(290, 70)" class="float float-d1">
        <rect class="stack-card" x="0" y="0" width="220" height="150" rx="10"/>
        <text class="subtitle" font-size="14" x="20" y="30">Software Engineering</text>
        <line x1="20" y1="45" x2="200" y2="45" stroke="rgba(255,255,255,0.1)"/>
        <g transform="translate(20, 60)">
            <rect class="chip" x="0" y="0" width="45" height="22" rx="4"/><text class="text" font-size="11" x="22" y="15" text-anchor="middle">C++</text>
            <rect class="chip" x="53" y="0" width="45" height="22" rx="4"/><text class="text" font-size="11" x="75" y="15" text-anchor="middle">OOP</text>
            <rect class="chip" x="106" y="0" width="60" height="22" rx="4"/><text class="text" font-size="11" x="136" y="15" text-anchor="middle">Systems</text>
            
            <rect class="chip" x="0" y="30" width="85" height="22" rx="4"/><text class="text" font-size="11" x="42" y="45" text-anchor="middle">Data Structs</text>
            <rect class="chip" x="93" y="30" width="80" height="22" rx="4"/><text class="text" font-size="11" x="133" y="45" text-anchor="middle">Algorithms</text>
        </g>
    </g>

    <!-- Web & Backend -->
    <g transform="translate(540, 70)" class="float float-d2">
        <rect class="stack-card" x="0" y="0" width="220" height="150" rx="10"/>
        <text class="subtitle" font-size="14" x="20" y="30">Web &amp; Backend</text>
        <line x1="20" y1="45" x2="200" y2="45" stroke="rgba(255,255,255,0.1)"/>
        <g transform="translate(20, 60)">
            <rect class="chip" x="0" y="0" width="60" height="22" rx="4"/><text class="text" font-size="11" x="30" y="15" text-anchor="middle">FastAPI</text>
            <rect class="chip" x="68" y="0" width="50" height="22" rx="4"/><text class="text" font-size="11" x="93" y="15" text-anchor="middle">Flask</text>
            <rect class="chip" x="126" y="0" width="65" height="22" rx="4"/><text class="text" font-size="11" x="158" y="15" text-anchor="middle">Streamlit</text>
            
            <rect class="chip" x="0" y="30" width="65" height="22" rx="4"/><text class="text" font-size="11" x="32" y="45" text-anchor="middle">React.js</text>
            <rect class="chip" x="73" y="30" width="60" height="22" rx="4"/><text class="text" font-size="11" x="103" y="45" text-anchor="middle">Node.js</text>
            <rect class="chip" x="141" y="30" width="35" height="22" rx="4"/><text class="text" font-size="11" x="158" y="45" text-anchor="middle">JS</text>
            
            <rect class="chip" x="0" y="60" width="75" height="22" rx="4"/><text class="text" font-size="11" x="37" y="75" text-anchor="middle">TailwindCSS</text>
            <rect class="chip" x="83" y="60" width="80" height="22" rx="4"/><text class="text" font-size="11" x="123" y="75" text-anchor="middle">HTML &amp; CSS</text>
        </g>
    </g>

    <!-- DB & Tools -->
    <g transform="translate(40, 240)" class="float float-d2">
        <rect class="stack-card" x="0" y="0" width="345" height="120" rx="10"/>
        <text class="subtitle" font-size="14" x="20" y="30">Databases &amp; Dev Tools</text>
        <line x1="20" y1="45" x2="325" y2="45" stroke="rgba(255,255,255,0.1)"/>
        <g transform="translate(20, 60)">
            <rect class="chip" x="0" y="0" width="55" height="22" rx="4"/><text class="text" font-size="11" x="27" y="15" text-anchor="middle">MySQL</text>
            <rect class="chip" x="63" y="0" width="45" height="22" rx="4"/><text class="text" font-size="11" x="85" y="15" text-anchor="middle">SQL</text>
            <rect class="chip" x="116" y="0" width="65" height="22" rx="4"/><text class="text" font-size="11" x="148" y="15" text-anchor="middle">Postman</text>
            <rect class="chip" x="189" y="0" width="40" height="22" rx="4"/><text class="text" font-size="11" x="209" y="15" text-anchor="middle">Git</text>
            <rect class="chip" x="237" y="0" width="60" height="22" rx="4"/><text class="text" font-size="11" x="267" y="15" text-anchor="middle">GitHub</text>
            
            <rect class="chip" x="0" y="30" width="55" height="22" rx="4"/><text class="text" font-size="11" x="27" y="45" text-anchor="middle">Linux</text>
            <rect class="chip" x="63" y="30" width="45" height="22" rx="4"/><text class="text" font-size="11" x="85" y="45" text-anchor="middle">Bash</text>
            <rect class="chip" x="116" y="30" width="80" height="22" rx="4"/><text class="text" font-size="11" x="156" y="45" text-anchor="middle">VS Code</text>
        </g>
    </g>

    <!-- Creative -->
    <g transform="translate(415, 240)" class="float float-d1">
        <rect class="stack-card" x="0" y="0" width="345" height="120" rx="10"/>
        <text class="subtitle" font-size="14" x="20" y="30">Creative &amp; Multimedia</text>
        <line x1="20" y1="45" x2="325" y2="45" stroke="rgba(255,255,255,0.1)"/>
        <g transform="translate(20, 60)">
            <rect class="chip" x="0" y="0" width="90" height="22" rx="4"/><text class="text" font-size="11" x="45" y="15" text-anchor="middle">Premiere Pro</text>
            <rect class="chip" x="98" y="0" width="90" height="22" rx="4"/><text class="text" font-size="11" x="143" y="15" text-anchor="middle">After Effects</text>
            <rect class="chip" x="196" y="0" width="75" height="22" rx="4"/><text class="text" font-size="11" x="233" y="15" text-anchor="middle">Photoshop</text>
            
            <rect class="chip" x="0" y="30" width="55" height="22" rx="4"/><text class="text" font-size="11" x="27" y="45" text-anchor="middle">Figma</text>
            <rect class="chip" x="63" y="30" width="90" height="22" rx="4"/><text class="text" font-size="11" x="108" y="45" text-anchor="middle">Video Editing</text>
            <rect class="chip" x="161" y="30" width="90" height="22" rx="4"/><text class="text" font-size="11" x="206" y="45" text-anchor="middle">Graphic Design</text>
        </g>
    </g>

</svg>